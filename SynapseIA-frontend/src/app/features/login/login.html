<div class="auth-page">

  <div class="auth-card">

    <div class="brand">

      <div class="brand-icon">
        S
      </div>

      <div>

        <h1>Synapse IA</h1>

        <p>
          Sistema inteligente de análisis
        </p>

      </div>

    </div>


    <div class="auth-header">

      <h2>Iniciar sesión</h2>

      <p>
        Accede a tu espacio de investigación.
      </p>

    </div>


    @if (errorMessage) {

      <div class="error-message">

        {{ errorMessage }}

      </div>

    }


    <form
      (ngSubmit)="login()"
    >

      <div class="form-group">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="credentials.email"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        >

      </div>


      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
        >

      </div>


      <button
        type="submit"
        [disabled]="loading"
      >

        @if (loading) {

          Iniciando sesión...

        } @else {

          Iniciar sesión

        }

      </button>

    </form>


    <div class="register-link">

      <span>
        ¿No tienes una cuenta?
      </span>

      <button
        type="button"
        (click)="goToRegister()"
      >
        Crear cuenta
      </button>

    </div>

  </div>

</div>
